name: CI / CD

on:
  push:
    branches:
      - develop   # → deploys to nonproduction
      - master    # → deploys to preproduction (production needs manual approval)

jobs:
  # ── 1. Build & Test ───────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Lint code
        run: npm run lint || true

  # ── 2. Deploy → Non-Production (develop branch only) ──────────────────────
  deploy-nonprod:
    name: Deploy → Non-Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    environment: nonproduction
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm install

      - name: Show actions files and version
        run: |
          echo "=== auth0-deploy-cli version ==="
          npx a0deploy --version
          echo "=== Actions directory ==="
          find local-mathdojo-nonproduction/actions -type f | sort
          echo "=== metadata.json content ==="
          cat local-mathdojo-nonproduction/actions/registerNewUser/metadata.json
          echo "=== code.js first 5 lines ==="
          head -5 local-mathdojo-nonproduction/actions/registerNewUser/code.js
          echo "=== Actions handler source (how it loads) ==="
          cat node_modules/auth0-deploy-cli/dist/src/tools/auth0/handlers/actions.js 2>/dev/null | head -100 || echo "File not found at that path"
          find node_modules/auth0-deploy-cli -name "actions.js" 2>/dev/null | head -5

      - name: Deploy to Non-Production Auth0 Tenant
        run: npx a0deploy deploy --input_file local-mathdojo-nonproduction --debug
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_NONPROD_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_NONPROD_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_NONPROD_CLIENT_SECRET }}

  # ── 3. Deploy → Pre-Production (master branch only) ───────────────────────
  deploy-preprod:
    name: Deploy → Pre-Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master'
    environment: preproduction
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm install

      - name: Deploy to Pre-Production Auth0 Tenant
        run: npx a0deploy deploy --input_file mathdojo-preproduction
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_PREPROD_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_PREPROD_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_PREPROD_CLIENT_SECRET }}

  # ── 4. Deploy → Production (master, manual approval required) ─────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: deploy-preprod
    if: github.ref == 'refs/heads/master'
    environment: production   # configure required reviewers in GitHub Settings → Environments
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm install

      - name: Deploy to Production Auth0 Tenant
        run: npx a0deploy deploy --input_file mathdojo-production
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_PROD_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_PROD_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_PROD_CLIENT_SECRET }}
